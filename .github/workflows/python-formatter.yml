name: Python Formatting Check

on: [push, pull_request]

jobs:
  python_formatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Black Formatter
        uses: lgeiger/black-action@master
        with:
          # rover_arm/ is vendored third-party code: keep it byte-identical to upstream
          args: ". --check --diff --line-length 90 --extend-exclude /rover_arm/"
